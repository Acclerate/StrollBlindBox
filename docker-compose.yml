# WalkBox 本地开发基础设施
# 仅用于本机验证 DDL / 种子数据 / 原型。凭据为开发默认值，勿用于生产。
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: walkbox-postgis
    environment:
      POSTGRES_USER: walkbox
      POSTGRES_PASSWORD: walkbox_dev
      POSTGRES_DB: walkbox
    ports:
      - "127.0.0.1:54329:5432"   # 避免与本机可能存在的 5432 冲突
    volumes:
      - walkbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walkbox -d walkbox"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  walkbox_pgdata:
